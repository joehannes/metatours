# Deploys the Tour Cana RD VIP design to its own Cloudflare Worker.
#
# This is a SEPARATE SITE out of the same repository, not a change to any
# existing one, and it is never merged into another branch. `nahiatours` is
# production; this is the clean Bavaro-inspired design for Tour Cana RD VIP.
#
# Three things keep it away from the live site, and all three would have to
# fail at once for a run here to touch it:
#
#   • wrangler.toml on this branch names the Worker `tourcanard`, and
#     `wrangler deploy` addresses a Worker by name — never by id;
#   • this workflow only runs on the `tourcanrd` branch;
#   • the KV namespace is `tourcanard-data`, created by the first run.
#
# THE DATA is a copy, taken once. scripts/clone-kv.mjs reads every key out of
# `nahiatours-data` and writes the ones `tourcanard-data` is missing, so the
# new site opens with the real catalogue rather than the seed JSON — and from
# that moment the two namespaces are independent. Editing a tour here cannot
# reach the live site, and vice versa.
#
# WHEN IT COPIES. Seeding is opt-in on every site (see CLAUDE.md): on an
# established site it would quietly restore content deleted on purpose. The
# one exception here is a namespace that does not exist yet or holds no keys
# at all — a brand-new site, which is exactly the one-time bootstrap the
# script exists for. Once this site has a single key of its own, a push never
# copies anything again; only the manual switch below does.
#
# THE TOKEN comes from a repository secret. It needs:
#   • Workers Scripts: Edit    — to deploy
#   • Workers KV Storage: Edit — to create `tourcanard-data` and fill it
# Add it under Settings → Secrets and variables → Actions.

name: Deploy Tour Cana RD

on:
  push:
    branches: [tourcanrd]
  workflow_dispatch:
    inputs:
      cloudflare_api_token:
        description: >-
          One-off Cloudflare API token (Workers Scripts: Edit + Workers KV
          Storage: Edit). Leave empty to use the CLOUDFLARE_API_TOKEN secret.
          Rotate any token passed this way once the deploy is done.
        required: false
        default: ''
      source_kv_title:
        description: >-
          Title of the KV namespace to copy data from. Leave empty to use
          nahiatours-data.
        required: false
        default: ''
      seed_kv_from_source:
        description: >-
          Copy keys this site is MISSING from the source namespace. This is the
          one-time bootstrap for a brand-new site and is off by default: on an
          established site it silently restores content that was deleted here
          on purpose, and gives any newly-stored key the production site's
          value. A key this site already has is never touched either way.
        required: false
        type: boolean
        default: false
      overwrite_existing:
        description: >-
          Re-copy the source over keys this site ALREADY has. This destroys
          anything edited through this site's own admin panel. Off by default,
          and there is no way to turn it on from a push — see scripts/clone-kv.mjs.
        required: false
        type: boolean
        default: false

concurrency:
  group: deploy-tourcanard
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN || inputs.cloudflare_api_token }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID || 'd5272033401c64f8cc6ce650a8321cb2' }}
      KV_NAMESPACE_TITLE: tourcanard-data
      SOURCE_KV_TITLE: ${{ inputs.source_kv_title || 'nahiatours-data' }}
      OVERWRITE: ${{ inputs.overwrite_existing == true && 'true' || 'false' }}
      SITE_URL: ${{ vars.TOURCANARD_SITE_URL || 'https://tourcanard.johannes-neugschwentner.workers.dev' }}

    steps:
      - name: Mask the token
        run: echo "::add-mask::${{ inputs.cloudflare_api_token }}"
        if: inputs.cloudflare_api_token != ''

      - name: Require a token
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: |
          echo "::error::No Cloudflare API token."
          echo "Add CLOUDFLARE_API_TOKEN under Settings → Secrets and variables →"
          echo "Actions (Workers Scripts: Edit + Workers KV Storage: Edit), or pass"
          echo "one as the cloudflare_api_token input when dispatching this workflow."
          exit 1

      - name: Normalize the token
        run: |
          clean="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]')"
          echo "::add-mask::$clean"
          echo "CLOUDFLARE_API_TOKEN=$clean" >> "$GITHUB_ENV"
          echo "CLOUDFLARE_ACCOUNT_ID=$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')" >> "$GITHUB_ENV"

          if   [ -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then src="CLOUDFLARE_API_TOKEN"
          elif [ -n "${{ secrets.CF_API_TOKEN }}" ];         then src="CF_API_TOKEN (fallback — is this stale?)"
          elif [ -n "${{ inputs.cloudflare_api_token }}" ];  then src="the workflow_dispatch input"
          else src="nowhere"; fi
          echo "Supplied by:  $src"
          echo "Length:       ${#clean}"

          bad="$(printf '%s' "$clean" | tr -d 'A-Za-z0-9_.-' | fold -w1 | sort -u | tr -d '\n')"
          if [ -n "$bad" ]; then
            echo "Stray chars:  [$bad] — an API token contains none of these."
            echo "              Re-add the secret as the bare token, nothing around it."
          else
            echo "Stray chars:  none"
          fi

      - uses: actions/checkout@v4

      - name: Check this branch deploys to tourcanard
        run: |
          name="$(grep -m1 '^name *= *' wrangler.toml | sed 's/.*= *"\(.*\)"/\1/')"
          echo "wrangler.toml names the Worker: $name"
          if [ "$name" != "tourcanard" ]; then
            echo "::error::wrangler.toml names \"$name\", not \"tourcanard\". Refusing to deploy."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Check whether this site's KV is brand new
        id: fresh
        run: |
          node --input-type=module -e '
            const token = process.env.CLOUDFLARE_API_TOKEN;
            const account = process.env.CLOUDFLARE_ACCOUNT_ID;
            const title = process.env.KV_NAMESPACE_TITLE;
            const api = (p) => fetch(`https://api.cloudflare.com/client/v4/accounts/${account}${p}`, { headers: { Authorization: `Bearer ${token}` } }).then((r) => r.json());
            let fresh = false;
            try {
              let page = 1, found = null;
              for (;;) {
                const res = await api(`/storage/kv/namespaces?per_page=100&page=${page}`);
                if (!res.success) throw new Error(JSON.stringify(res.errors));
                found = res.result.find((ns) => ns.title === title) || found;
                if (found || res.result.length < 100) break;
                page++;
              }
              if (!found) {
                fresh = true;
                console.log(`${title} does not exist yet: first deploy, will seed.`);
              } else {
                const keys = await api(`/storage/kv/namespaces/${found.id}/keys?limit=10`);
                fresh = keys.success && keys.result.length === 0;
                console.log(`${title} (${found.id}) holds ${keys.result?.length ?? "?"}${keys.result?.length === 10 ? "+" : ""} key(s): ${fresh ? "empty, will seed" : "established, will not seed"}.`);
              }
            } catch (error) {
              console.log(`Could not tell (${error.message}); not seeding.`);
            }
            const { appendFileSync } = await import("node:fs");
            appendFileSync(process.env.GITHUB_OUTPUT, `fresh=${fresh}\n`);
          '

      - name: Clone the KV data
        id: kv
        if: inputs.seed_kv_from_source == true || steps.fresh.outputs.fresh == 'true'
        continue-on-error: true
        run: node scripts/clone-kv.mjs

      - name: Inventory the KV namespaces
        run: node scripts/kv-inventory.mjs
        env:
          KV_INVENTORY_TITLES: nahiatours-data,beautiful-tours-data,transporturist-data,ldvip-data,amigotours-data,elcortecito-data,tourcanard-data

      - name: Build
        run: npm run build

      - name: Show the resolved KV binding
        run: |
          echo "wrangler.toml KV binding after the build:"
          grep -n -A2 '^\[\[kv_namespaces\]\]' wrangler.toml

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: deploy --var BUILD_COMMIT:${{ github.sha }} --var BUILD_TIME:${{ github.event.repository.updated_at }}

      - name: Report where it landed
        run: |
          {
            echo "### Tour Cana RD VIP deployed"
            echo ""
            echo "<https://tourcanard.johannes-neugschwentner.workers.dev>"
            echo ""
            echo "Worker \`tourcanard\`, from branch \`tourcanrd\` at \`${GITHUB_SHA::7}\`."
            echo ""
            if [ "${{ inputs.seed_kv_from_source }}" != "true" ] && [ "${{ steps.fresh.outputs.fresh }}" != "true" ]; then
              echo "KV: nothing copied. This site reads its own namespace, and keys it does not have fall back to the bundled \`/data/*.json\`."
            elif [ "${{ steps.kv.outcome }}" != "success" ]; then
              echo "> [!WARNING]"
              echo "> **KV was not copied.** The deploy went ahead and the site is up, but it"
              echo "> is reading the seed data bundled at \`/data/*.json\`, not the live"
              echo "> catalogue. See the *Clone the KV data* step for the reason."
            else
              echo "KV: ${{ steps.kv.outputs.keys_copied }} missing key(s) seeded from \`${{ steps.kv.outputs.source_title }}\` into \`tourcanard-data\` (\`${{ steps.kv.outputs.namespace_id }}\`)."
            fi
            echo ""
            echo "Workers AI is bound as \`AI\` in wrangler.toml, so the blog generator"
            echo "runs without any key being entered in the admin panel."
          } >> "$GITHUB_STEP_SUMMARY"